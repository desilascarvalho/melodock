<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artista · Melodock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0D0D0F',
            surface: { DEFAULT: '#161618', 2: '#1E1E21' },
            accent: { DEFAULT: '#7C3AED', hover: '#6D28D9', light: '#A855F7' },
            txt: { DEFAULT: '#F5F5F7', sec: '#8E8E93', muted: '#48484A' },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: { card: '12px', el: '8px' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="artist" class="bg-base text-txt font-sans antialiased min-h-screen">
  <div id="sidebar-root"></div>

  <main class="lg:pl-60 min-h-screen" data-screen-label="Artista">
    <div class="px-6 lg:px-10 py-8 pt-20 lg:pt-8 max-w-[1100px] mx-auto">

      <!-- Breadcrumb -->
      <nav class="mb-6 text-sm text-txt-sec">
        <a href="artists-list.html" class="hover:text-white transition-colors">Artistas</a>
        <span class="mx-2 text-txt-muted">/</span>
        <span id="bc-name" class="text-txt">…</span>
      </nav>

      <!-- Artist header -->
      <header class="flex items-center gap-6 mb-10" id="artist-header">
        <div id="artist-photo" class="w-24 h-24 rounded-full shrink-0 overflow-hidden bg-surface-2 flex items-center justify-center text-2xl font-bold text-txt-sec">…</div>
        <div>
          <h1 id="artist-name" class="text-3xl font-bold tracking-tight">…</h1>
          <p id="artist-meta" class="text-txt-sec text-sm mt-1"></p>
        </div>
        <div class="ml-auto hidden sm:flex gap-2">
          <button id="btn-sync" class="px-4 py-2 rounded-el border border-white/10 text-sm text-txt-sec hover:text-white hover:border-white/20 transition-colors">↻ Sincronizar</button>
        </div>
      </header>

      <!-- Albums -->
      <section>
        <h2 class="text-base font-semibold text-txt-sec uppercase tracking-wider mb-4">Discografia</h2>
        <div id="albums-loading" class="text-txt-sec text-sm py-8 text-center">Carregando…</div>
        <div id="albums-list" class="space-y-3"></div>
      </section>

    </div>
  </main>

  <!-- Toast -->
  <div id="toast-root" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="js/api.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/artist.js?v=2"></script>
</body>
</html>
