<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs · Melodock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0D0D0F',
            surface: { DEFAULT: '#161618', 2: '#1E1E21' },
            accent: { DEFAULT: '#7C3AED', hover: '#6D28D9', light: '#A855F7' },
            txt: { DEFAULT: '#F5F5F7', sec: '#8E8E93', muted: '#48484A' },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: { card: '12px', el: '8px' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="logs" class="bg-base text-txt font-sans antialiased min-h-screen">
  <div id="sidebar-root"></div>

  <main class="lg:pl-60 min-h-screen" data-screen-label="Logs">
    <div class="px-6 lg:px-10 py-8 pt-20 lg:pt-8 max-w-[1100px] mx-auto">

      <header class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight">Logs</h1>
        <p class="text-txt-sec text-sm mt-1">Saída do servidor em tempo real</p>
      </header>

      <div class="flex flex-wrap items-center gap-3 mb-4">
        <select id="level-filter" class="input text-sm py-2">
          <option value="ALL">Todos os níveis</option>
          <option value="INFO">INFO</option>
          <option value="WARN">WARN</option>
          <option value="ERROR">ERROR</option>
        </select>
        <label class="flex items-center gap-2 text-sm text-txt-sec cursor-pointer select-none">
          <input type="checkbox" id="auto-scroll" checked class="accent-[#7C3AED] w-4 h-4"> Auto-scroll
        </label>
        <button id="clear-logs" class="btn-secondary ml-auto text-sm py-2">Limpar</button>
      </div>

      <div id="log-view" class="rounded-card border border-white/5 font-mono text-[13px] leading-6 p-4 overflow-y-auto h-[calc(100vh-240px)] min-h-[320px]" style="background: #0A0A0B;"></div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
