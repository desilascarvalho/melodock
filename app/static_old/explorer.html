<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorer · Melodock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0D0D0F',
            surface: { DEFAULT: '#161618', 2: '#1E1E21' },
            accent: { DEFAULT: '#7C3AED', hover: '#6D28D9', light: '#A855F7' },
            txt: { DEFAULT: '#F5F5F7', sec: '#8E8E93', muted: '#48484A' },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          borderRadius: { card: '12px', el: '8px' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="explorer" class="bg-base text-txt font-sans antialiased min-h-screen">
  <div id="sidebar-root"></div>

  <main class="lg:pl-60 min-h-screen" data-screen-label="Explorer">
    <div class="px-6 lg:px-10 py-8 pt-20 lg:pt-8 max-w-[1100px] mx-auto">

      <header class="mb-8">
        <h1 class="text-2xl font-bold tracking-tight">Explorer</h1>
        <p class="text-txt-sec text-sm mt-1">Descubra artistas relacionados aos da sua biblioteca</p>
      </header>

      <div class="bg-surface rounded-card border border-white/5 p-5 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
        <label for="artist-select" class="text-sm font-medium text-txt-sec shrink-0">Artista central</label>
        <select id="artist-select" class="input w-full sm:max-w-xs"></select>
      </div>

      <h2 id="related-title" class="text-lg font-semibold mt-10 mb-4 hidden">Artistas relacionados</h2>
      <div id="related-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 pb-10"></div>
      <div id="explorer-state" class="text-center text-txt-muted text-sm mt-14">Carregando artistas…</div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/explorer.js"></script>
</body>
</html>
